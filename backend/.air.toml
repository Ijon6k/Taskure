root = "."
tmp_dir = "/tmp/air"
testdata_dir = "testdata"

[build]
  bin = "/tmp/air/server"
  cmd = "go build -o /tmp/air/server ./cmd/server"
  delay = 1000
  exclude_dir = ["assets", "tmp", "testdata", "vendor", "docs", "node_modules", ".git"]
  exclude_regex = ["_test.go", "_mock.go"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_dir = ["cmd", "internal"]
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
