version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: kanban-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
      ai:
        condition: service_started
    networks:
      - kanban-network
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile.dev
    container_name: kanban-web
    ports:
      - "3000:3000"
    volumes:
      - ../apps/web:/app/apps/web
      - ../packages:/app/packages
      - ../bun-workspace.yaml:/app/bun-workspace.yaml:ro
      - ../package.json:/app/package.json:ro
      - web-node-modules:/app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - NODE_ENV=development
    networks:
      - kanban-network
    restart: unless-stopped
    depends_on:
      - api

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile.dev
    container_name: kanban-api
    ports:
      - "4000:4000"
    volumes:
      - ../apps/api:/app
      - api-go-cache:/root/.cache/go-build
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - API_HOST=0.0.0.0
      - API_PORT=4000
    networks:
      - kanban-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  ai:
    build:
      context: ../services/ai
      dockerfile: Dockerfile.dev
    container_name: kanban-ai
    ports:
      - "5000:5000"
    volumes:
      - ../services/ai:/app
    env_file:
      - .env
    environment:
      - AI_HOST=0.0.0.0
      - AI_PORT=5000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - kanban-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: kanban-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-kanban}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kanban-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanban} -d ${POSTGRES_DB:-kanban}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kanban-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - kanban-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    container_name: kanban-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    networks:
      - kanban-network
    restart: unless-stopped
    command: server /data --console-address ":9001"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  web-node-modules:
  api-go-cache:

networks:
  kanban-network:
    driver: bridge
