# ============================================================
# KANBAN PROJECT — Local Development Overrides
# Run via CLI: ./scripts/dev.ts
# Or Docker: docker compose -f compose.yaml -f compose.dev.yaml up -d
# ============================================================

services:
  caddy:
    container_name: kanban-gateway-dev
    ports:
      - "${PORT_GATEWAY:-${PORT_NGINX:-1106}}:80"
    depends_on: []
    profiles:
      - full
      - gateway
      - caddy

  web:
    container_name: kanban-web-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - NODE_ENV=development
      - PORT=3000
    ports:
      - "${PORT_WEB:-3000}:3000"
    volumes:
      - ./frontend:/app
    command: bun run dev
    depends_on: []
    profiles:
      - full
      - web

  api:
    container_name: kanban-api-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - APP_ENV=development
      - GOCACHE=/tmp/.go-build
      - GOPATH=/tmp/go
    ports:
      - "${PORT_API:-4000}:4000"
    volumes:
      - ./backend:/app
    profiles:
      - full
      - services
      - api

  ai:
    container_name: kanban-ai-dev
    build:
      context: ./ai
      dockerfile: Dockerfile
      target: dev
    user: "${UID:-1000}:${GID:-1000}"
    extra_hosts:
      # Let the AI service reach LLM proxies bound to the Docker host.
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - UV_CACHE_DIR=/tmp/.uv-cache
      - AI_HOST=0.0.0.0
      - AI_PORT=5000
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - FAST_MAX_TOKENS=${FAST_MAX_TOKENS:-500}
      - THINKING_MAX_TOKENS=${THINKING_MAX_TOKENS:-4000}
      - PLANNING_MAX_TOKENS=${PLANNING_MAX_TOKENS:-8000}
      - AGENT_MAX_TOKENS=${AGENT_MAX_TOKENS:-16000}
      - RAG_CHUNK_SIZE=${RAG_CHUNK_SIZE:-1024}
      - RAG_CHUNK_OVERLAP=${RAG_CHUNK_OVERLAP:-128}
      - RAG_TOP_K=${RAG_TOP_K:-5}
      - RAG_SIMILARITY_THRESHOLD=${RAG_SIMILARITY_THRESHOLD:-0.7}
      - REFLECTION_QUALITY_THRESHOLD=${REFLECTION_QUALITY_THRESHOLD:-80}
      - REFLECTION_TIMEOUT_SECONDS=${REFLECTION_TIMEOUT_SECONDS:-120}
      - HITL_APPROVAL_TIMEOUT_SECONDS=${HITL_APPROVAL_TIMEOUT_SECONDS:-300}
      - AI_WORKER_POLL_INTERVAL=${AI_WORKER_POLL_INTERVAL:-5}
      - AI_MEMORY_EVOLUTION_THRESHOLD=${AI_MEMORY_EVOLUTION_THRESHOLD:-15}
      - AI_PLAN_CACHE_TTL_HOURS=${AI_PLAN_CACHE_TTL_HOURS:-24}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    ports:
      - "${PORT_AI:-5000}:5000"
    volumes:
      - ./ai:/app
    profiles:
      - full
      - services
      - ai

  postgres:
    container_name: kanban-postgres-dev
    ports:
      - "${PORT_POSTGRES:-5432}:5432"
    profiles:
      - full
      - services
      - db

  minio:
    container_name: kanban-minio-dev
    ports:
      - "${PORT_MINIO:-9000}:9000"
      - "${PORT_MINIO_CONSOLE:-9001}:9001"
    profiles:
      - full
      - services
      - db
