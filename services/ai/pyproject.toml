[project]
name = "@kanban/ai"
version = "0.1.0"
description = "AI service for Kanban — LLM Gateway + RAG"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "openai==1.57.4",
    "anthropic==0.38.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "pgvector-python[async]==0.2.3",
    "redis[hiredis]==5.2.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "python-multipart==0.0.20",
    "sse-starlette==2.2.1",
    "httpx==0.28.1",
    "numpy==2.2.2",
    "tiktoken==0.8.0",
    "tenacity==9.0.0",
    "structlog==24.4.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "httpx==0.28.1",
    "ruff==0.9.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
