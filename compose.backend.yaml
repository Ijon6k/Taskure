# ============================================================
# TASKURE — Backend Only Docker & Podman Compose Stack
# Run:   docker compose -f compose.backend.yaml up -d
#        podman-compose -f compose.backend.yaml up -d
# Stop:  docker compose -f compose.backend.yaml down
# Reset: docker compose -f compose.backend.yaml down -v
# ============================================================

services:
  api:
    image: ghcr.io/ijon6k/taskure/backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: kanban-api
    ports:
      - "${PORT_API:-4000}:4000"
    environment:
      - APP_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-kanban}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-kanban}
      - S3_ENDPOINT=seaweedfs:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-seaweedadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-seaweedadmin}
      - S3_BUCKET=${S3_BUCKET:-kanban-uploads}
      - S3_PUBLIC_URL=/storage/kanban-uploads
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    networks:
      - kanban-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  ai:
    image: ghcr.io/ijon6k/taskure/ai:${IMAGE_TAG:-latest}
    build:
      context: ./ai
      dockerfile: Dockerfile
      target: runner
    container_name: kanban-ai
    ports:
      - "${PORT_AI:-5000}:5000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-kanban}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-kanban}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kanban-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: kanban-postgres
    ports:
      - "${PORT_POSTGRES:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-kanban}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kanban-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanban} -d ${POSTGRES_DB:-kanban}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:latest
    container_name: kanban-seaweedfs
    command: "server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json"
    ports:
      - "${PORT_S3:-9000}:9000"
      - "${PORT_S3_FILER:-8888}:8888"
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro,z
    networks:
      - kanban-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres-data:
  seaweedfs-data:

networks:
  kanban-network:
    driver: bridge
