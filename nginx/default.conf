upstream web_upstream {
    server web:3000;
}

upstream api_upstream {
    server api:4000;
}

upstream ai_upstream {
    server ai:5000;
}

upstream minio_upstream {
    server minio:9000;
}

# Rate Limiting Zones — 100 requests per second per IP for API, 50 for AI (http context)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=50r/s;

server {
    listen 80;
    server_name localhost;

    # Docker Embedded DNS Resolver — re-resolve container IPs dynamically
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 500M;


    # Gzip Compression Optimization
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Next.js Frontend
    location / {
        set $web_target http://web:3000;
        proxy_pass $web_target;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js Static Assets — long-term browser cache
    location /_next/static/ {
        set $web_target http://web:3000;
        proxy_pass $web_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Go REST API
    location /api/ {
        limit_req zone=api_limit burst=200 nodelay;
        set $api_target http://api:4000;
        proxy_pass $api_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Go API Health Check
    location /health {
        set $api_target http://api:4000;
        proxy_pass $api_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Storage Assets Proxy (Go API Dynamic Resizing & MinIO Storage Engine)
    location /storage/ {
        set $api_storage_target http://api:4000/storage/;
        proxy_pass $api_storage_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Python AI Service Swagger Docs (dev convenience, not used by the app)
    location /ai/docs {
        set $ai_docs_target http://ai:5000/docs;
        proxy_pass $ai_docs_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
