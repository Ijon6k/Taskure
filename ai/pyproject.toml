[project]
name = "kanban-ai"
version = "0.1.0"
description = "AI service for Kanban — LLM Gateway + RAG"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "openai>=1.50.0",
    "anthropic>=0.38.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.0.0",
    "httpx>=0.28.0",
    "numpy>=2.0.0",
    "tiktoken>=0.8.0",
    "tenacity>=9.0.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
    "PyPDF2>=3.0.0",
    "python-docx>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

# Pyright: the AI service intentionally passes dynamic **kwargs into the
# OpenAI/Anthropic SDKs (base_url, tools, …), so "Any is not allowed" and
# "partially unknown" reports are noise rather than real problems.
[tool.pyright]
reportAny = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportMissingTypeStubs = false
reportAttributeAccessIssue = "warning"
