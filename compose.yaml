# ============================================================
# TASKURE — Production Docker & Podman Compose Stack (Self-Hosted)
# Run from project root:
#   Docker Compose: docker compose up -d
#   Podman Compose: podman compose up -d
# Stop:  docker compose down  /  podman compose down
# Reset: docker compose down -v  /  podman compose down -v
# ============================================================

services:
  nginx:
    image: ghcr.io/ijon6k/taskure/gateway:${IMAGE_TAG:-latest}
    container_name: kanban-nginx
    ports:
      - "${PORT_NGINX:-1106}:80"
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
      ai:
        condition: service_started
    networks:
      - kanban-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  web:
    image: ghcr.io/ijon6k/taskure/frontend:${IMAGE_TAG:-latest}
    container_name: kanban-web
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - api
    networks:
      - kanban-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  api:
    image: ghcr.io/ijon6k/taskure/backend:${IMAGE_TAG:-latest}
    container_name: kanban-api
    expose:
      - "4000"
    environment:
      - APP_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-kanban}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-kanban}
      - S3_ENDPOINT=seaweedfs:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-seaweedadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-seaweedadmin}
      - S3_BUCKET=${S3_BUCKET:-kanban-uploads}
      - S3_PUBLIC_URL=/storage/kanban-uploads
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-encryption-key-32-bytes!!}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOMEMLIMIT=384MiB
      - VARIANT_WORKERS=2
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - kanban-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  ai:
    image: ghcr.io/ijon6k/taskure/ai:${IMAGE_TAG:-latest}
    container_name: kanban-ai
    expose:
      - "5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - AI_HOST=0.0.0.0
      - AI_PORT=5000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-kanban}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-kanban}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - FAST_MAX_TOKENS=${FAST_MAX_TOKENS:-500}
      - THINKING_MAX_TOKENS=${THINKING_MAX_TOKENS:-4000}
      - PLANNING_MAX_TOKENS=${PLANNING_MAX_TOKENS:-8000}
      - AGENT_MAX_TOKENS=${AGENT_MAX_TOKENS:-16000}
      - RAG_CHUNK_SIZE=${RAG_CHUNK_SIZE:-1024}
      - RAG_CHUNK_OVERLAP=${RAG_CHUNK_OVERLAP:-128}
      - RAG_TOP_K=${RAG_TOP_K:-5}
      - RAG_SIMILARITY_THRESHOLD=${RAG_SIMILARITY_THRESHOLD:-0.7}
      - REFLECTION_QUALITY_THRESHOLD=${REFLECTION_QUALITY_THRESHOLD:-80}
      - REFLECTION_TIMEOUT_SECONDS=${REFLECTION_TIMEOUT_SECONDS:-120}
      - HITL_APPROVAL_TIMEOUT_SECONDS=${HITL_APPROVAL_TIMEOUT_SECONDS:-300}
      - AI_WORKER_POLL_INTERVAL=${AI_WORKER_POLL_INTERVAL:-5}
      - AI_MEMORY_EVOLUTION_THRESHOLD=${AI_MEMORY_EVOLUTION_THRESHOLD:-15}
      - AI_PLAN_CACHE_TTL_HOURS=${AI_PLAN_CACHE_TTL_HOURS:-24}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kanban-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: kanban-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-kanban}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kanban-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanban} -d ${POSTGRES_DB:-kanban}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:latest
    container_name: kanban-seaweedfs
    command: "server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json"
    expose:
      - "9000"
      - "8888"
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - kanban-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8888/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  postgres-data:
  seaweedfs-data:

networks:
  kanban-network:
    driver: bridge
