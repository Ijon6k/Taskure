# ============================================================
# KANBAN PROJECT — Production Docker Compose Stack (Self-Hosted)
# Run from project root: docker compose up -d
# Stop: docker compose down
# Reset: docker compose down -v
# ============================================================

services:
  nginx:
    image: nginx:1.26-alpine
    container_name: kanban-nginx
    ports:
      - "${PORT_NGINX:-1106}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
      - ai
    networks:
      - kanban-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M


  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: kanban-web
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - api
    networks:
      - kanban-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: kanban-api
    expose:
      - "4000"

    environment:
      - APP_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-kanban}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-kanban}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-kanban-uploads}
      - MINIO_PUBLIC_URL=/storage/kanban-uploads
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-encryption-key-32-bytes!!}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Soft memory ceiling for the Go GC; keeps RSS comfortably under the
      # container limit even while background variant workers decode bitmaps.
      - GOMEMLIMIT=384MiB
      - VARIANT_WORKERS=2
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - kanban-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
      target: runner
    container_name: kanban-ai
    expose:
      - "5000"
    extra_hosts:
      # Let the AI service reach LLM proxies bound to the Docker host
      # (Ollama, LM Studio, vLLM, custom gateways on localhost).
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - AI_HOST=0.0.0.0
      - AI_PORT=5000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-kanban}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-kanban}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - FAST_MAX_TOKENS=${FAST_MAX_TOKENS:-500}
      - THINKING_MAX_TOKENS=${THINKING_MAX_TOKENS:-4000}
      - PLANNING_MAX_TOKENS=${PLANNING_MAX_TOKENS:-8000}
      - AGENT_MAX_TOKENS=${AGENT_MAX_TOKENS:-16000}
      - RAG_CHUNK_SIZE=${RAG_CHUNK_SIZE:-1024}
      - RAG_CHUNK_OVERLAP=${RAG_CHUNK_OVERLAP:-128}
      - RAG_TOP_K=${RAG_TOP_K:-5}
      - RAG_SIMILARITY_THRESHOLD=${RAG_SIMILARITY_THRESHOLD:-0.7}
      - REFLECTION_QUALITY_THRESHOLD=${REFLECTION_QUALITY_THRESHOLD:-80}
      - REFLECTION_TIMEOUT_SECONDS=${REFLECTION_TIMEOUT_SECONDS:-120}
      - HITL_APPROVAL_TIMEOUT_SECONDS=${HITL_APPROVAL_TIMEOUT_SECONDS:-300}
      - AI_WORKER_POLL_INTERVAL=${AI_WORKER_POLL_INTERVAL:-5}
      - AI_MEMORY_EVOLUTION_THRESHOLD=${AI_MEMORY_EVOLUTION_THRESHOLD:-15}
      - AI_PLAN_CACHE_TTL_HOURS=${AI_PLAN_CACHE_TTL_HOURS:-24}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kanban-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  postgres:
    image: pgvector/pgvector:pg16
    container_name: kanban-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-kanban}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kanban-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanban} -d ${POSTGRES_DB:-kanban}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: kanban-minio

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    networks:
      - kanban-network
    restart: unless-stopped
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres-data:
  minio-data:


networks:
  kanban-network:
    driver: bridge
