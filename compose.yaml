# ============================================================
# TASKURE — Production Docker & Podman Compose Stack (Self-Hosted)
# Run from project root:
#   Docker Compose: docker compose up -d
#   Podman Compose: podman-compose up -d
# Stop:  docker compose down  /  podman-compose down
# Reset: docker compose down -v  /  podman-compose down -v
# ============================================================

services:
  nginx:
    image: docker.io/library/nginx:1.26-alpine
    container_name: kanban-nginx
    ports:
      - "${PORT_NGINX:-1106}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - web
      - api
      - ai
    networks:
      - kanban-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  web:
    image: ghcr.io/ijon6k/taskure/frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: kanban-web
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - api
    networks:
      - kanban-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    image: ghcr.io/ijon6k/taskure/backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: kanban-api
    expose:
      - "4000"
    environment:
      - APP_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-kanban}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-kanban}
      - MINIO_ENDPOINT=seaweedfs:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-kanban-uploads}
      - MINIO_PUBLIC_URL=/storage/kanban-uploads
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOMEMLIMIT=384MiB
      - VARIANT_WORKERS=2
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    networks:
      - kanban-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  ai:
    image: ghcr.io/ijon6k/taskure/ai:${IMAGE_TAG:-latest}
    build:
      context: ./ai
      dockerfile: Dockerfile
      target: runner
    container_name: kanban-ai
    expose:
      - "5000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-kanban}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-kanban}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kanban-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: kanban-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-kanban}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kanban-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanban} -d ${POSTGRES_DB:-kanban}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:latest
    container_name: kanban-seaweedfs
    command: "server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json"
    ports:
      - "${PORT_S3:-9000}:9000"
      - "${PORT_S3_FILER:-8888}:8888"
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro,z
    networks:
      - kanban-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres-data:
  seaweedfs-data:

networks:
  kanban-network:
    driver: bridge
